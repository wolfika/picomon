[package]
name = "picomon"
version = "0.1.0"
edition = "2024"
description = "Tiny self-hosted Linux server monitor with a web dashboard"
license = "MIT"
repository = "https://github.com/wolfika/picomon"
readme = "README.md"
# Distributed as release binaries, not on crates.io.
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
libc = "0.2.191"
mime_guess = "2.0.5"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
