# Releases are driven by release-please. On every push to main the CI checks
# run first; if they pass, release-please opens or updates a release PR from
# the conventional commits since the last release. Merging that PR tags the
# release, and the jobs below then attach smoke-tested static binaries and
# checksums to it.
#
# The build jobs live in this workflow because they need release-please's
# outputs: whether this push cut a release, and its tag. This avoids depending
# on whether GitHub starts a separate workflow for a tag that this workflow's
# GITHUB_TOKEN created.

name: Release

on:
  push:
    branches: [main]

# Read-only by default. Only the jobs that create releases, tags, pull
# requests or release assets get write access; the build jobs, which run
# third-party code (npm packages, build scripts, cross images), do not.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: picomon-linux-x86_64
          - target: aarch64-unknown-linux-musl
            asset: picomon-linux-aarch64
          - target: armv7-unknown-linux-musleabihf
            asset: picomon-linux-armv7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      # The frontend is embedded at compile time and is the same for every target.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cross
      # musl targets give fully static binaries that run on any distribution.
      - run: cross build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/picomon ${{ matrix.asset }}

      # Registers QEMU with binfmt_misc, so the static ARM binaries run directly.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - run: .github/scripts/smoke-test.sh ${{ matrix.asset }} "${TAG#v}"
        env:
          TAG: ${{ needs.release-please.outputs.tag }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum picomon-linux-* > SHA256SUMS
        working-directory: dist
      - run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
