# Weekly update PRs, one per ecosystem. Prefixes keep them out of releases;
# a dependency change that matters to users can be released with a fix commit.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      web:
        patterns: ["*"]
    ignore:
      # svelte-check 4 only runs on TypeScript 7 alongside TypeScript 6 and an
      # experimental flag. Remove this once it supports TypeScript 7 alone.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
